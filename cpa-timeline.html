<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1315">
<title>CPA タイムライン</title>
<style>
/* Layout: one-column phone app. Live screen = big clock + quick buttons + running log. Result screen = timeline. */
:root{
  --bg:#0f1315; --surface:#181e21; --surface2:#20282c; --line:#2a3338;
  --fg:#e8eef0; --muted:#8a989e; --accent:#ffb020; --rec:#ff5457; --voice:#3ddbb0;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
body{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:560px;margin:0 auto;min-height:100dvh}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.04em;color:var(--muted)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.on{background:rgba(255,84,87,.16);color:var(--rec)}
.pill.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rec);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.on::before{animation:none}}

.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:64px;font-weight:600;text-align:center;letter-spacing:.02em;line-height:1.1;margin:6px 0 2px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.big{width:100%;padding:20px;border-radius:14px;font-size:20px;font-weight:700;letter-spacing:.06em}
.big.start{background:var(--accent);color:#1a1200}
.big.stop{background:var(--rec);color:#fff}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.warn{background:rgba(255,176,32,.12);color:var(--accent);padding:10px 12px;border-radius:10px;font-size:13px;margin:12px 0}
.err{background:rgba(255,84,87,.14);color:#ff9a9c}

.heard{background:var(--surface);border-radius:10px;padding:10px 12px;margin:14px 0 8px;min-height:3.2em;font-size:14px;color:var(--muted)}
.heard b{color:var(--fg);font-weight:500}
.sec{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{background:var(--surface2);padding:12px 4px;border-radius:10px;font-size:13px;min-height:52px;line-height:1.25}
.grid button:active{background:var(--line)}

.tl{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.row .l{font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .c{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:2}
.row .gap{font-family:var(--mono);font-size:12px;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.row .src{font-size:11px;color:var(--muted);text-align:right;grid-column:3}
.row .src.v{color:var(--voice)}
.row .edit{grid-column:1/-1;display:flex;gap:8px;padding-top:8px}
.row .edit button{flex:1;background:var(--surface2);border-radius:8px;padding:9px 0;font-size:13px}
.row .edit .del{color:var(--rec)}
.row.tap{cursor:pointer}
.empty{color:var(--muted);font-size:14px;padding:14px 0}
.card{background:var(--surface);border-radius:12px;padding:4px 14px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions button{background:var(--surface2);padding:14px 8px;border-radius:10px;font-weight:600}
.actions .wide{grid-column:1/-1}
.actions .primary{background:var(--accent);color:#1a1200}
details{margin-top:18px;color:var(--muted);font-size:14px}
summary{cursor:pointer;padding:6px 0}
details label{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--fg)}
.try{display:flex;gap:8px;margin-top:8px}
.try input[type=text]{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.try button{background:var(--surface2);padding:0 14px;border-radius:8px}
.sumbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sumbox div{background:var(--surface);border-radius:10px;padding:10px 12px}
.sumbox small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em}
.sumbox strong{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.tr{font-size:13px;color:var(--muted);padding:6px 0;border-top:1px solid var(--line)}
.tr span{font-family:var(--mono);color:var(--fg);margin-right:8px}
audio{width:100%;margin-top:10px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:5}
</style>
</head>
<body>
<div class="top"><h1>CPA タイムライン</h1><span id="state" class="pill">待機中</span></div>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ===== キーワード辞書 =====
   認識結果は NFKC・小文字化・空白除去・カタカナ→ひらがな に正規化してから照合する。
   re は正規化後の文字列に対する正規表現。cool は同一イベントの再検知を抑える時間(ms)。 */
const MIN = 60000;
const EVENTS = [
  {id:"arrive", label:"現場到着",        re:/げんちゃく|現着/, cool:Infinity},
  {id:"bls",    label:"BLS開始",         re:/bls|びーえるえす|胸骨圧迫(開始|はじめ|かいし)|心臓まっさーじ(開始|かいし)|しんぞうまっさーじ(開始|かいし)|cpr開始/, cool:Infinity},
  {id:"lucas",  label:"LUCAS装着",       re:/lucas|るーかす|るかす/, cool:Infinity},
  {id:"aed",    label:"AED装着",         re:/aed|えーいーでぃー|えーいーでー|ぱっど/, cool:Infinity},
  {id:"rhythm", label:"波形解析",        re:/解析|かいせき|はけい|波形|りずむちぇっく/, cool:20000},
  {id:"shock",  label:"ショック",        re:/(しょっく|ショック)(?!ふよう|不要|なし|無し|ひつようない|必要ない|適応なし|てきおうなし|てきおうがい|適応外)/, cool:30000},
  {id:"bvm",    label:"BVM換気",         re:/bvm|びーぶいえむ|ばっぐばるぶ|人工呼吸|じんこうこきゅう/, cool:Infinity},
  {id:"airway", label:"気道確保",        re:/igel|あいじぇる|あいげる|声門上|こうもんじょう|気管挿管|きかんそうかん|えあうぇい|気道確保|きどうかくほ/, cool:2*MIN},
  {id:"iv",     label:"IV確保",          re:/iv|あいぶい|静脈路|じょうみゃくろ|るーと確保|るーとかくほ|骨髄路|こつずいろ|io確保/, cool:2*MIN},
  {id:"ad",     label:"Ad投与",          re:/ad投与|あど投与|あどとうよ|あどれなりん|えぴねふりん|ぼすみん|ボスミン/, cool:MIN},
  {id:"amio",   label:"アミオダロン投与", re:/あみおだろん|あみおでろん|あんかろん/, cool:2*MIN},
  {id:"rosc",   label:"心拍再開(ROSC)",  re:/rosc|ろすく|ろーすく|心拍再開|しんぱくさいかい|自己心拍/, cool:30000},
  {id:"move",   label:"搬送開始",        re:/搬送開始|はんそうかいし|車内収容|しゃないしゅうよう|しゅっぱつ|出発/, cool:Infinity},
  {id:"hosp",   label:"病院到着",        re:/病院到着|びょういんとうちゃく|びょうちゃく|病着/, cool:Infinity},
];
const QUICK = ["bls","lucas","aed","shock","iv","ad","airway","rosc","move"];
const byId = Object.fromEntries(EVENTS.map(e=>[e.id,e]));

function norm(s){
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/[\s\-・、。,.!?！？「」『』()（）]/g,"")
    .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
// 正規表現側の ボスミン / ショック 等のカタカナも同じ正規化にかける
for(const e of EVENTS){ e.rx = new RegExp(toHira(e.re.source),"g"); }
function toHira(src){ return src.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }

/* ===== 状態 ===== */
const S = {running:false, t0:0, t1:0, events:[], log:[], seen:{}, seg:0, view:"home"};
let rec=null, wantRun=false, timer=null, wakeLock=null, mr=null, chunks=[], audioUrl=null, audioExt="webm";
let heardText="", openRow=null, saveAudio=false, lastErr="";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ===== 検知 ===== */
function addEvent(id, t, src){
  const ev = byId[id];
  const last = [...S.events].reverse().find(x=>x.id===id);
  if(src==="voice" && last && t-last.t < ev.cool) return false;
  S.events.push({id, label:ev.label, t, src});
  S.events.sort((a,b)=>a.t-b.t);
  return true;
}
function feed(segKey, raw, now){
  const text = norm(raw);
  for(const ev of EVENTS){
    const m = text.match(ev.rx); const n = m ? m.length : 0;
    const k = S.seen[segKey+ev.id]||0;
    if(n>k){ S.seen[segKey+ev.id]=n; for(let i=k;i<n;i++) addEvent(ev.id, now, "voice"); }
  }
}

/* ===== 音声認識 ===== */
function startRec(){
  if(!SR){ lastErr="この端末のブラウザは音声認識に未対応です。iPhoneはSafari、AndroidはChromeで開いてください。手動ボタンは使えます。"; return; }
  rec = new SR();
  rec.lang="ja-JP"; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  const session = ++S.seg;
  rec.onresult = e=>{
    const now = Date.now();
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i]; const txt = r[0].transcript;
      feed(session+":"+i, txt, now);
      heardText = txt;
      if(r.isFinal && txt.trim()) S.log.push({t:now, text:txt.trim()});
    }
    render();
  };
  rec.onerror = e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      lastErr="マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください。"; wantRun=false; render();
    }
  };
  rec.onend = ()=>{ if(wantRun) setTimeout(()=>{ if(wantRun) startRec(); },250); };
  try{ rec.start(); }catch(_){}
}
async function startAudio(){
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    const types=["audio/mp4","audio/webm;codecs=opus","audio/webm"];
    const mt = types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
    audioExt = mt.includes("mp4")?"m4a":"webm";
    mr = new MediaRecorder(st, mt?{mimeType:mt}:undefined); chunks=[];
    mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); if(chunks.length){ audioUrl=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType})); } render(); };
    mr.start(1000);
  }catch(_){ mr=null; }
}

/* ===== 開始 / 終了 ===== */
async function begin(){
  Object.assign(S,{running:true,t0:Date.now(),t1:0,events:[],log:[],seen:{},view:"live"});
  heardText=""; lastErr=""; openRow=null; audioUrl=null; mr=null;
  wantRun=true; startRec();
  if(saveAudio) startAudio();
  try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch(_){}
  timer=setInterval(tick,250); render();
}
function finish(){
  wantRun=false; S.running=false; S.t1=Date.now();
  try{ rec&&rec.stop(); }catch(_){}
  try{ mr&&mr.state!=="inactive"&&mr.stop(); }catch(_){}
  clearInterval(timer); try{ wakeLock&&wakeLock.release(); }catch(_){}
  S.view="result"; save(); render();
}
document.addEventListener("visibilitychange",async()=>{
  if(S.running && document.visibilityState==="visible"){ try{ wakeLock=await navigator.wakeLock?.request("screen"); }catch(_){} }
});
function tick(){ const el=document.getElementById("clk"); if(el) el.textContent=mmss(Date.now()-S.t0); }

/* ===== 保存 ===== */
function save(){ try{ localStorage.setItem("cpa-last",JSON.stringify({t0:S.t0,t1:S.t1,events:S.events,log:S.log})); }catch(_){} }
function loadLast(){ try{ const d=JSON.parse(localStorage.getItem("cpa-last")||"null"); return d; }catch(_){ return null; } }

/* ===== 表示用 ===== */
const p2=n=>String(n).padStart(2,"0");
function mmss(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); return p2(Math.floor(s/60))+":"+p2(s%60); }
function hms(t){ const d=new Date(t); return p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds()); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function rowsHtml(editable){
  if(!S.events.length) return `<div class="empty">${S.running?"まだ記録はありません。声に出すか、下のボタンを押すと記録されます。":"記録はありません。"}</div>`;
  let prev=null;
  return `<ul class="tl">`+S.events.map((e,i)=>{
    const gap = prev!==null ? "+"+mmss(e.t-prev) : ""; prev=e.t;
    const edit = editable && openRow===i ? `<div class="edit"><button data-a="nudge" data-i="${i}" data-d="-10">−10秒</button><button data-a="nudge" data-i="${i}" data-d="10">+10秒</button><button class="del" data-a="del" data-i="${i}">削除</button></div>`:"";
    return `<li class="row ${editable?"tap":""}" data-a="open" data-i="${i}">
      <span class="t">${mmss(e.t-S.t0)}</span><span class="l">${esc(e.label)}</span><span class="gap">${gap}</span>
      <span class="c">${hms(e.t)}</span><span class="src ${e.src==="voice"?"v":""}">${e.src==="voice"?"音声":"手動"}</span>${edit}</li>`;
  }).join("")+`</ul>`;
}

function intervalText(){
  const f=id=>S.events.find(e=>e.id===id);
  const bls=f("bls"), ad=f("ad"), lucas=f("lucas"), iv=f("iv"), rosc=f("rosc");
  const d=(a,b)=>a&&b?mmss(b.t-a.t):"--:--";
  return [["活動時間",mmss((S.t1||Date.now())-S.t0)],["BLS→LUCAS",d(bls,lucas)],["BLS→IV確保",d(bls,iv)],["BLS→初回Ad",d(bls,ad)],["BLS→ROSC",d(bls,rosc)],["Ad投与回数",S.events.filter(e=>e.id==="ad").length+"回"]];
}

function reportText(){
  const d=new Date(S.t0);
  const head=`心肺停止活動 時系列  ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}  活動時間 ${mmss((S.t1||Date.now())-S.t0)}`;
  let prev=null;
  const lines=S.events.map(e=>{ const g=prev!==null?`（+${mmss(e.t-prev)}）`:""; prev=e.t; return `${mmss(e.t-S.t0)}  ${hms(e.t)}  ${e.label}${g}${e.src==="manual"?"［手動］":""}`; });
  return [head,...lines].join("\n");
}

/* ===== 画面 ===== */
function render(){
  const app=document.getElementById("app"), st=document.getElementById("state");
  st.className="pill"+(S.running?" on":""); st.textContent=S.running?"録音中":(S.view==="result"?"記録済み":"待機中");
  if(S.view==="home"){
    const last=loadLast();
    app.innerHTML=`
      <div class="clock" style="color:var(--muted)">00:00</div>
      <div class="sub">活動開始ボタンで音声の監視を始めます</div>
      <button class="big start" data-a="begin">活動開始</button>
      ${lastErr?`<div class="warn err">${esc(lastErr)}</div>`:""}
      ${!SR?`<div class="warn">このブラウザは音声認識に未対応です。iPhoneはSafari、AndroidはChromeで開いてください。手動ボタンだけ使えます。</div>`:""}
      <p class="hint">「BLS開始」「LUCAS装着」「IV確保」「Ad投与」などと声に出すと、その時刻を記録します。誤認識や聞き逃しは、手動ボタンと修正で補えます。</p>
      <details><summary>設定・試し入力</summary>
        <label><input type="checkbox" id="chkAudio" ${saveAudio?"checked":""}> 音声も保存する（端末によっては認識と競合します）</label>
        ${last?`<button class="big" style="background:var(--surface2);font-size:15px;padding:12px;margin-top:8px" data-a="last">前回の記録を見る</button>`:""}
      </details>`;
    return;
  }
  if(S.view==="live"){
    app.innerHTML=`
      <div class="clock" id="clk">${mmss(Date.now()-S.t0)}</div>
      <div class="sub">開始 ${hms(S.t0)}</div>
      <button class="big stop" data-a="finish">活動終了</button>
      ${lastErr?`<div class="warn err">${esc(lastErr)}</div>`:""}
      ${!SR?`<div class="warn">音声認識に未対応のため手動記録のみです。</div>`:""}
      <div class="heard">${heardText?`<b>${esc(heardText)}</b>`:"聞き取り中…"}</div>
      <div class="sec">手動で記録</div>
      <div class="grid">${QUICK.map(id=>`<button data-a="manual" data-id="${id}">${byId[id].label}</button>`).join("")}</div>
      <div class="sec">時系列</div>
      <div class="card">${rowsHtml(true)}</div>
      <details><summary>文字で試す（音声の代わり）</summary>
        <div class="try"><input type="text" id="tryTxt" placeholder="例: LUCAS装着します"><button data-a="try">入力</button></div>
      </details>`;
    return;
  }
  // result
  app.innerHTML=`
    <div class="clock" style="font-size:44px">${mmss((S.t1||Date.now())-S.t0)}</div>
    <div class="sub">${new Date(S.t0).toLocaleString("ja-JP")} 開始</div>
    <div class="sumbox">${intervalText().map(([k,v])=>`<div><small>${k}</small><strong>${v}</strong></div>`).join("")}</div>
    <div class="card">${rowsHtml(true)}</div>
    <div class="sec">手動で追加</div>
    <div class="grid">${QUICK.map(id=>`<button data-a="manual" data-id="${id}">${byId[id].label}</button>`).join("")}</div>
    <div class="actions">
      <button class="primary wide" data-a="copy">時系列をコピー</button>
      <button data-a="new">新しい活動</button>
      <button data-a="home">戻る</button>
    </div>
    ${audioUrl?`<audio controls src="${audioUrl}"></audio><p class="hint"><a style="color:var(--accent)" href="${audioUrl}" download="cpa-${S.t0}.${audioExt}">音声を保存</a></p>`:""}
    ${S.log.length?`<details><summary>認識された発話（${S.log.length}件）</summary>${S.log.map(l=>`<div class="tr"><span>${mmss(l.t-S.t0)}</span>${esc(l.text)}</div>`).join("")}</details>`:""}`;
}

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,1800); }
async function copyReport(){
  const txt=reportText();
  try{ await navigator.clipboard.writeText(txt); toast("コピーしました"); return; }catch(_){}
  const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("コピーしました"); }catch(_){ toast("コピーできませんでした"); } ta.remove();
}

document.addEventListener("change",e=>{ if(e.target.id==="chkAudio") saveAudio=e.target.checked; });
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, i=+b.dataset.i;
  if(a==="begin") begin();
  else if(a==="finish") finish();
  else if(a==="manual"){ addEvent(b.dataset.id, Date.now()-(S.running?0:0), "manual"); if(!S.running) { /* 結果画面での追加は終了時刻を上限に */ const ev=S.events.find(x=>x.src==="manual"&&x.t>S.t1); if(ev) ev.t=S.t1; S.events.sort((x,y)=>x.t-y.t); save(); } toast(byId[b.dataset.id].label+" を記録"); render(); }
  else if(a==="open"){ if(e.target.closest(".edit")) return; openRow=(openRow===i?null:i); render(); }
  else if(a==="nudge"){ S.events[i].t+=(+b.dataset.d)*1000; S.events.sort((x,y)=>x.t-y.t); openRow=null; save(); render(); }
  else if(a==="del"){ S.events.splice(i,1); openRow=null; save(); render(); }
  else if(a==="copy") copyReport();
  else if(a==="new"){ S.view="home"; S.events=[]; audioUrl=null; render(); }
  else if(a==="home"){ S.view="home"; render(); }
  else if(a==="last"){ const d=loadLast(); if(d){ Object.assign(S,{t0:d.t0,t1:d.t1,events:d.events,log:d.log,view:"result"}); render(); } }
  else if(a==="try"){ const el=document.getElementById("tryTxt"); if(el.value){ feed("try"+(++S.seg),el.value,Date.now()); heardText=el.value; el.value=""; render(); } }
});
window.__cpa={norm,feed,S,EVENTS};  // テスト用
render();
</script>
</body>
